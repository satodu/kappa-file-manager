[package]
name = "kappa-file-manager"
version = "0.1.0-beta.1"
edition = "2024"
description = "Brutalist file manager for Ryoku OS: Rust core with a Quickshell (QML) interface"
license = "0BSD"
repository = "https://github.com/satodu/kappa-file-manager"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
mime_guess = "2.0.5"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
trash = "5.2.9"
walkdir = "2.5.0"
